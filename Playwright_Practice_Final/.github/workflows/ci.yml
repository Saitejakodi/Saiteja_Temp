name: Playwright UI Tests

on:
  push:
    branches:
      - main
      - master
      - Saiteja_Final_Capstone

  pull_request:
    branches:
      - main
      - master
      - Saiteja_Final_Capstone

  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_UI_Testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playwright_UI_Testing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
          INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
          INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_UI_Testing/playwright-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Playwright_UI_Testing/test-results/