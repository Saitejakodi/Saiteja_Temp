name: Automation CI Pipeline

on:
  push:
    branches:
      - Saiteja_Final_Assessment_Temp

  pull_request:
    branches:
      - Saiteja_Final_Assessment_Temp

  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_Practice_Final

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playwright_Practice_Final/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
          echo "STANDARD_USERNAME=${{ secrets.STANDARD_USERNAME }}" >> .env
          echo "STANDARD_PASSWORD=${{ secrets.STANDARD_PASSWORD }}" >> .env
          echo "LOCKED_USERNAME=${{ secrets.LOCKED_USERNAME }}" >> .env
          echo "INVALID_USERNAME=${{ secrets.INVALID_USERNAME }}" >> .env
          echo "INVALID_PASSWORD=${{ secrets.INVALID_PASSWORD }}" >> .env

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Practice_Final/playwright-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Playwright_Practice_Final/test-results/

  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest
    needs: ui-tests

    defaults:
      run:
        working-directory: API_Testing_Practice_Final

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: Build and Run API Tests
        run: mvn clean test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: API_Testing_Practice_Final/target/surefire-reports/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API_Testing_Practice_Final/target/allure-results/